<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budsjettkalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="kropp">
    <div id="header"><h1>Budsjettkalkulator</h1></div>
    <nav><a href="index.html">Hjem</a><a onclick="window.print()">Skriv Ut</a><a href="innstillinger.html">Innstillinger</a></nav>
    <div id="kalk">
        <div id="inntekter">
            <h2>Inntekter</h2>
            <input placeholder="Inntektskilde..." id="inputinntektnavn" >
            <input placeholder="Verdi (kr)" id="inputinntektpenger" type="number">
            <button onclick="leggtilinntekt()">Legg til</button>
            <div class="lister">
                <ul id="listinntekt"></ul>
                <ul id="listinntektpenger"></ul>
            </div>
            
        </div>
        <div id="utgifter">
            <h2>Utgifter</h2>
            <input placeholder="Utgift..." id="inpututgiftnavn">
            <input placeholder="Verdi (kr)" id="inpututgiftpenger" type="number">
            <button onclick="leggtilutgift()">Legg til</button>
            <div class="lister">
                <ul id="listutgift"></ul>
                <ul id="listutgiftpenger"></ul>
            </div>
        </div>
    </div>

    <h2>Penger på slutten av måneden: <span id="saldo">0</span>kr</h2>
    <script src="script.js"></script>
</body>
</html>
