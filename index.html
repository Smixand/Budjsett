<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budsjettkalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="kalk">
        <div id="inntekter">
            <h2>Inntekter</h2>
            <input placeholder="Navn" id="inputinntektnavn">
            <input placeholder="Penger" id="inputinntektpenger">
            <button onclick="leggtilinntekt()">Legg til</button>
            <div id="lister">
                <ul id="listinntekt"></ul>
                <ul id="listinntektpenger"></ul>
            </div>
            
        </div>
        <div id="utgifter">
            <h2>Utgifter</h2>
            <input placeholder="Navn" id="inpututgiftnavn">
            <input placeholder="Penger" id="inpututgiftpenger">
            <button onclick="leggtilutgift()">Legg til</button>
        </div>
    </div>

    <h1>Saldo: <span>0</span> kr</h1>
    <script src="script.js"></script>
</body>
</html>
